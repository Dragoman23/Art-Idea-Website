<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inital-scale=1.0">
    <title>Art Idea Wheel</title>
    <link rel="stylesheet" href="style1.css">

<body>

<nav class="navigation">
    <a href="topic.html">Art Topic Wheel</a>
    <a href="medium.html">Medium Type Wheel</a>

<div class="description-box">
    <h1 class="title">Art Topic Wheel</h1>
    <p class="description">Spin the wheel. Once it has finished spinning, it will display a general topic for someone to base their art on.</p>
</div>

<div class="wheel">
    <button id="spin">Spin</button>
    <span class="arrow"></span>
    <div class="container">
        <div class="one">1</div>
        <div class="two">2</div>
        <div class="three">3</div>
        <div class="four">4</div>
        <div class="five">5</div>
        <div class="six">6</div>
        <div class="seven">7</div>
        <div class="eight">8</div>
    </div>
</div>
<div>
    <p id="result"></p>
</div>
<script src="script1.js"></script>
</body>
</html>
