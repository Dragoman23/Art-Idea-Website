<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium Wheel</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

<nav class = "navigation">
    <a href="topic.html">Art Topic Wheel</a>
    <a href="medium.html">Medium Type Wheel</a>
</nav>

<div class="description-box">
    <h1 class="title">Medium Type Wheel</h1>
    <p class="description">Spin the wheel. Once it has finished spinning, it will display a medium type for someone to use to create their art.</p>
</div>

<div class="wheel">
    <button id="spin">SPIN</button>
    <span class="arrow"></span>
    <div class="container">
        <div class="pencil"></div>
        <div class="ballpoint"></div>
        <div class="fountain-pen"></div>
        <div class="brush-pen"></div>
        <div class="watercolor"></div>
        <div class="acrylic"></div>
        <div class="gouache"></div>
        <div class="clay"></div>
        <div class="digital"></div>
        <div class="colored"></div>
        <div class="oil-pastel"></div>
        <div class="mixed"></div>
    </div>
</div>
<div>
    <p id="result"></p>
</div>
<script src="script2.js"></script>
</body>
</html>
